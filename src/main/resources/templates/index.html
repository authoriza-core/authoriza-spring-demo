<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OIDC Demo Client</title>
</head>
<body>
    <h1>OIDC Demo Client</h1>

    <div th:if="${authenticated == false}">
        <p>
            <strong>Статус:</strong>
            не авторизован
        </p>

        <p>
            <a href="/oauth2/authorization/autoriza">
                <button type="button">Войти через Авторизу</button>
            </a>
        </p>

        <p>
            <a href="/restore-session">
                <button type="button">Восстановить сессию</button>
            </a>
        </p>
    </div>

    <div th:if="${authenticated == true}">
        <p>
            <strong>Статус:</strong>
            авторизован
        </p>

        <p>
            <strong>Имя:</strong>
            <span th:text="${userName}">Имя</span>
        </p>

        <p>
            <strong>Email:</strong>
            <span th:text="${userEmail}">Email</span>
        </p>

        <p>
            <a href="/profile">
                <button type="button">Открыть профиль</button>
            </a>
        </p>

        <p>
            <a href="/userinfo">
                <button type="button">Получить UserInfo</button>
            </a>
        </p>

        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">Выйти</button>
        </form>
    </div>
</body>
</html>
