<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка обновления токенов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            line-height: 1.6;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .error {
            color: #b71c1c;
            background: #ffebee;
            border: 1px solid #ef9a9a;
            padding: 12px;
            border-radius: 6px;
        }

        .button {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 6px;
            background: #1f6feb;
            color: white;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .button.secondary {
            background: #666;
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td, th {
            border-bottom: 1px solid #eee;
            padding: 8px;
            vertical-align: top;
            text-align: left;
        }

        th {
            width: 220px;
        }
    </style>
</head>
<body>

<h1>Ошибка обновления токенов</h1>

<div class="card">
    <p class="error">
        Не удалось обновить токены.
    </p>

    <table>
        <tr>
            <th>Сообщение</th>
            <td th:text="${message} ?: 'Описание ошибки не получено'">message</td>
        </tr>
        <tr>
            <th>Код ошибки</th>
            <td th:text="${errorCode} ?: 'Код ошибки отсутствует'">errorCode</td>
        </tr>
        <tr>
            <th>Время операции</th>
            <td th:text="${refreshedAt} ?: 'Неизвестно'">refreshedAt</td>
        </tr>
    </table>
</div>

<div class="card">
    <h2>Действия</h2>

    <div class="actions">
        <a class="button" th:href="@{/profile}">
            Вернуться в профиль
        </a>

        <a class="button secondary" th:href="@{/oauth2/authorization/autoriza}">
            Войти заново
        </a>
    </div>
</div>

</body>
</html>
